[project]
name = "ecc-research"
version = "0.1.0"
description = "Reproducible experiments for rateless LDGM/LDPC research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anywidget>=0.9.18",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "joblib>=1.4",
    "jupyterlab>=4.2",
    "nbformat>=5.10",
    "numba>=0.60",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=6.0",
    "pyarrow>=17.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
